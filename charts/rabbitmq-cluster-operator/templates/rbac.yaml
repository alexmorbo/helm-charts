{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq-cluster-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}
  labels: {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [create, get, list, update, watch]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, update, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [create, get, list, update, watch]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters/finalizers]
    verbs: [update]
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters/status]
    verbs: [get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, roles]
    verbs: [create, delete, get, list, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}
  labels: {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq-cluster-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.serviceBinding }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}-service-binding
  labels:
    {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
    servicebinding.io/controller: "true"
rules:
  - apiGroups: [rabbitmq.com]
    resources: [rabbitmqclusters]
    verbs: [get, list, watch]
{{- end }}
{{- end }}
