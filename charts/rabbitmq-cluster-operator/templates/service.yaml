{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq-cluster-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: metrics
      protocol: TCP
  selector: {{- include "rabbitmq-cluster-operator.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq-cluster-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rabbitmq-cluster-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
  selector: {{- include "rabbitmq-cluster-operator.selectorLabels" . | nindent 4 }}
{{- end }}
