{{- $createDbSecret := and (not .Values.app.database.existingSecret) .Values.app.database.host }}
{{- $createRedisSecret := and (not .Values.app.redis.existingSecret) .Values.app.redis.password }}
{{- if or $createDbSecret $createRedisSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "immich.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $createDbSecret }}
  {{- $dbKeys := .Values.app.database.secretKeys }}
  {{ $dbKeys.host }}: {{ .Values.app.database.host | b64enc | quote }}
  {{ $dbKeys.port }}: {{ .Values.app.database.port | toString | b64enc | quote }}
  {{ $dbKeys.username }}: {{ .Values.app.database.username | b64enc | quote }}
  {{ $dbKeys.password }}: {{ required "immich: app.database.password is required when app.database.existingSecret is not set" .Values.app.database.password | b64enc | quote }}
  {{ $dbKeys.database }}: {{ .Values.app.database.name | b64enc | quote }}
  {{- end }}
  {{- if $createRedisSecret }}
  redis-password: {{ .Values.app.redis.password | b64enc | quote }}
  {{- end }}
{{- end }}
