{{- if .Values.machineLearning.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.machineLearningFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
    {{- with .Values.machineLearning.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.machineLearning.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.machineLearning.service.type }}
  ports:
    - port: {{ .Values.machineLearning.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "immich.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: machine-learning
{{- end }}
