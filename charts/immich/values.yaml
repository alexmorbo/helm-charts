# ==============================================================================
# Global configuration
# ==============================================================================
global:
  # -- Global image registry (used as fallback for all components)
  imageRegistry: ""
  # -- Global deployment strategy (used as fallback for all components).
  # Recreate is the default on purpose: the library lives on ReadWriteOnce block
  # storage and a RollingUpdate would deadlock on the volume attachment.
  strategy:
    type: Recreate

# ==============================================================================
# Main immich server configuration
# ==============================================================================
image:
  # -- Image registry (falls back to global.imageRegistry, then to ghcr.io)
  registry: ""
  repository: immich-app/immich-server
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Inject the legacy docker-link environment variables of every Service in
# the namespace into the server pod. MUST stay false: the server Service is
# named after the release, so Kubernetes injects
# IMMICH_PORT=tcp://<clusterIP>:2283 - and immich reads IMMICH_PORT as its own
# listen port, which makes the container crash on startup with
# "[IMMICH_PORT] Invalid input: expected number, received NaN".
# The chart also sets IMMICH_PORT explicitly, which shadows the injected value,
# but there is no reason to turn this on.
enableServiceLinks: false

# -- Deployment strategy (falls back to global.strategy)
strategy: {}

# -- Additional init containers
extraInitContainers: []

# -- Environment variables to add to the pods
extraEnv: []
# -- Environment variables from secrets or configmaps to add to the pods
extraEnvFrom: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 2283
  annotations: {}
  labels: {}

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: immich.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# -- Hardware accelerated transcoding for the server container.
# Exposes the render devices of the node into the container.
hwaccel:
  enabled: false
  # -- Host path of the DRI render devices
  hostPath: /dev/dri
  # -- Mount path inside the container
  mountPath: /dev/dri
  # -- Run the container privileged (usually required to access /dev/dri)
  privileged: true

# -- Startup probe. The first start runs the database schema migrations,
# the defaults therefore allow ~310s before the container is restarted.
startupProbe:
  httpGet:
    path: /api/server/ping
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /api/server/ping
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/server/ping
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ==============================================================================
# Machine learning configuration
# ==============================================================================
machineLearning:
  enabled: true
  image:
    # -- Registry (falls back to global.imageRegistry, then to ghcr.io)
    registry: ""
    repository: immich-app/immich-machine-learning
    # -- Overrides the image tag whose default is the chart appVersion.
    # Use a hardware flavour suffix to switch backends, e.g. "v3.1.0-openvino".
    tag: ""
    pullPolicy: IfNotPresent

  # -- Same as the top level enableServiceLinks, for the machine learning pod.
  # MUST stay false: the injected IMMICH_PORT=tcp://<clusterIP>:2283 of the
  # server Service is read by immich_ml as its own listen port and crashes the
  # container with a pydantic int_parsing ValidationError.
  enableServiceLinks: false

  # -- Strategy (falls back to global.strategy)
  strategy: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  # -- Environment variables to add to the machine learning pod
  extraEnv: []
  # -- Environment variables from secrets or configmaps
  extraEnvFrom: []

  service:
    type: ClusterIP
    port: 3003
    annotations: {}
    labels: {}

  # -- Hardware acceleration for the machine learning container
  # (required by the OpenVINO image flavour)
  hwaccel:
    enabled: false
    hostPath: /dev/dri
    mountPath: /dev/dri
    privileged: false

  volumes: []
  volumeMounts: []

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -- Startup probe. The first start downloads the ML models,
  # the defaults therefore allow ~610s before the container is restarted.
  startupProbe:
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  livenessProbe:
    httpGet:
      path: /ping
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ping
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ==============================================================================
# Persistence configuration
# ==============================================================================
persistence:
  # -- Immich library (originals, thumbnails, encoded video, profile).
  # This chart never creates or deletes this PVC: it holds the photo archive and
  # is owned by the platform (e.g. Terraform with prevent_destroy).
  library:
    enabled: true
    # -- Name of the pre-existing PVC to mount. Required when enabled.
    existingClaim: ""
    mountPath: /data
    subPath: ""

  # -- Machine learning model cache. Created by this chart.
  cache:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""
    mountPath: /cache
    # -- Annotations for the cache PVC, e.g.
    # helm.sh/resource-policy: keep
    annotations: {}

# ==============================================================================
# Monitoring configuration
# ==============================================================================
monitoring:
  enabled: false
  # -- Type of service monitor: ServiceMonitor (Prometheus) or VMServiceScrape (VictoriaMetrics)
  type: ServiceMonitor
  # -- Metrics port exposed by the server once telemetry is enabled
  port: 8081
  # -- Value of IMMICH_TELEMETRY_INCLUDE (all, host, api, io, repo, job)
  telemetryInclude: all
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  namespace: ""

# ==============================================================================
# Application configuration
# ==============================================================================
app:
  # -- Timezone (e.g., Europe/Moscow, UTC)
  timeZone: ""

  # -- Database configuration. PostgreSQL with the vector extension is required
  # and is expected to be provisioned outside of this chart.
  database:
    # -- Existing secret holding the connection details. When set, every
    # DB_* variable is read from it and no secret is created by this chart.
    existingSecret: ""
    secretKeys:
      host: host
      port: port
      username: username
      password: password
      database: database
    # -- Plain values, used only when existingSecret is empty.
    # The chart then renders them into its own secret.
    host: ""
    port: 5432
    username: immich
    password: ""
    name: immich
    # -- Vector extension to use, e.g. vectorchord or pgvector.
    # Left empty the server keeps its own default.
    vectorExtension: ""

  # -- Redis / Valkey configuration. When the bundled valkey subchart is
  # enabled the host is resolved automatically.
  redis:
    host: ""
    port: 6379
    # -- Redis database index
    dbIndex: ""
    # -- Password, used only when existingSecret is empty
    password: ""
    existingSecret: ""
    existingSecretKey: password

# ==============================================================================
# Valkey subchart configuration
# See https://github.com/valkey-io/valkey-helm for all options
# ==============================================================================
valkey:
  enabled: true
  dataStorage:
    enabled: false
  nodeSelector: {}
  tolerations: []
  affinity: {}
