{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq-messaging-topology-operator.metricsServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: {{ .Values.metrics.secure | ternary "https" "http" }}
      port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.secure | ternary "https" "http" }}
      protocol: TCP
  selector: {{- include "rabbitmq-messaging-topology-operator.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq-messaging-topology-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
  selector: {{- include "rabbitmq-messaging-topology-operator.selectorLabels" . | nindent 4 }}
{{- end }}
